# Verificação de PR. Espelha o ci.yml do Clinic-Control, com duas diferenças:
# este projeto não tem suíte de testes, e roda na Vercel (não na VPS).
#
# Processo compartilhado entre os dois repos:
# https://github.com/g4bs2006/Clinic-Control/blob/main/CONTRIBUTING.md
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # A versão de produção não está fixada em lugar nenhum: sem Dockerfile,
          # sem `engines`, sem `.nvmrc` — a Vercel escolhe o default dela. Aqui
          # usamos a mesma major do Clinic-Control para os dois repos falharem
          # igual. Se um dia aparecer bug específico de versão, fixar nos dois.
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Tipos
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        # `next build` executa código de módulo, então as variáveis precisam
        # existir — não serem válidas. Valores de fachada evitam depender de
        # secrets. (Sem step de testes: este projeto não tem suíte.)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
          CRON_SECRET: ci-cron-secret
        run: npm run build
